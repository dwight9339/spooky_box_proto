; PlatformIO is used here as a VS Code task runner. The STM32CubeMX dual-core
; project remains built by the existing CMake presets; PlatformIO must not try
; to rebuild it as a conventional single-core STM32 project.

[platformio]
default_envs = spooky_box_picoprobe
src_dir = platformio

[env:spooky_box_picoprobe]
platform = native
platform_packages =
    platformio/tool-openocd@3.1200.0
extra_scripts = platformio/deploy.py

; These appear as configurable project options for platformio/deploy.py.
custom_cmake_preset = Debug
custom_adapter_speed = 1000

; Used by PlatformIO's separate Monitor task for the Pico UART bridge.
monitor_speed = 115200
monitor_parity = N
monitor_eol = CRLF
monitor_echo = yes

; Explicit bench experiments; the default environment stays on Debug.
[env:spooky_box_ipc_smoke]
extends = env:spooky_box_picoprobe
custom_cmake_preset = IpcSmoke

[env:spooky_box_ipc_mismatch]
extends = env:spooky_box_picoprobe
custom_cmake_preset = IpcMismatch

; Halloween 2026 demo image (decision 0011); exists only on the demo branch.
[env:spooky_box_demo]
extends = env:spooky_box_picoprobe
custom_cmake_preset = Demo
